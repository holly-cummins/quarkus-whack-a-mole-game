# The target logo, loaded from the classpath, so a native mole needs it built in
quarkus.native.resources.includes=quarkus-logo.png

# Mole apocalypse: new moles flash red, as an alarm
%apocalypse.mole.entrance.flash.colour=#FF3B30

# The controller runs moles with its game's profile, such as apocalypse, which differs from the
# profile a native mole was built with. Quarkus warns about that, once per mole; it doesn't matter
# here, as the moles' profile settings are all read at runtime.
quarkus.log.category."io.quarkus.runtime.configuration.ConfigRecorder".level=ERROR
