quarkus.banner.enabled=false
quarkus.log.level=WARN

# Whack-a-mole is the default game; see GameConfig for the settings and their defaults.
# The apocalypse profile switches to mole apocalypse. Use it with -Dquarkus.profile=apocalypse
# (before `launch`) or QUARKUS_PROFILE=apocalypse. The profile is passed on to each mole, so the
# moles have %apocalypse settings too.
%apocalypse.moles.game=apocalypse
%apocalypse.moles.count=24
# Start with just the bottom row or so, and let the moles rise from there
%apocalypse.moles.sparseness=80
